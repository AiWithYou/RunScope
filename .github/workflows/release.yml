name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Audit Windows dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
          command: check advisories
          arguments: --locked --target x86_64-pc-windows-msvc

  release:
    needs: advisories
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release package
        shell: pwsh
        run: .\build_release.ps1
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $cargoToml = Get-Content -LiteralPath "Cargo.toml" -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw "Could not read package version from Cargo.toml"
          }
          $version = $Matches[1]
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tagVersion) {
              throw "Tag version $tagVersion does not match Cargo.toml version $version"
          }
      - name: Smoke test executable
        shell: pwsh
        run: |
          .\dist\RunScope.exe --version
          if ($LASTEXITCODE -ne 0) { throw "RunScope --version failed" }
          .\dist\RunScope.exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "RunScope --self-check failed" }
      - name: Record, observe exits and recover interrupted journal
        run: python scripts/smoke_recording.py dist/RunScope.exe
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@67e779bf43eaa76e0777a5fd2a82bfe6c7d31f13 # v3.0.0
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/RunScope.exe
            dist/RunScope-windows-x64.zip
            dist/SHA256SUMS.txt
