name: Prepare v2

on:
  push:
    branches: [work/v2]
    paths:
      - '.v2-transport/**'
      - '.github/workflows/prepare-v2.yml'

permissions:
  contents: write

concurrency:
  group: prepare-v2
  cancel-in-progress: false

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.97.1"
          command: check advisories
          arguments: --locked --target x86_64-pc-windows-msvc

  prepare:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Apply reviewed fixes
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, shutil
          payload = lzma.decompress(base64.b64decode(pathlib.Path('.v2-transport/fix.xz.b64').read_text(), validate=True))
          assert hashlib.sha256(payload).hexdigest() == '0bf8e1550835a6a98e93ff7fc0f2e4ae0fe228058ff6d8e4bdcce457fdec98ec'
          exec(compile(payload, 'reviewed-v2-fixes.py', 'exec'))
          shutil.rmtree('.v2-transport')
      - name: Format implementation
        run: cargo fmt --all
      - name: Commit fixes on work branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: preserve interrupted writes and validate native time precision'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:work/v2
          if ($LASTEXITCODE -ne 0) { throw 'Non-fast-forward push or permission failure' }
          git archive --format=zip --output=RunScope-v2-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          git log -1 --oneline
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RunScope-v2-source
          path: RunScope-v2-source.zip
          retention-days: 7
      - name: Format check
        run: cargo fmt --all --check
      - name: Check
        id: check
        continue-on-error: true
        run: cargo check --locked
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: cargo test --locked
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Require all checks
        shell: pwsh
        run: |
          if ('${{ steps.check.outcome }}' -ne 'success' -or '${{ steps.tests.outcome }}' -ne 'success' -or '${{ steps.clippy.outcome }}' -ne 'success') { throw 'Native validation failed' }
      - name: Build release
        shell: pwsh
        run: .\build_release.ps1
      - name: Native executable diagnostics
        shell: pwsh
        run: |
          .\dist\RunScope.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          .\dist\RunScope.exe --self-check
          if ($LASTEXITCODE -ne 0) { throw 'Self-check failed' }
      - name: Recording and recovery integration
        run: python scripts/smoke_recording.py dist/RunScope.exe
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RunScope-v2-windows-x64
          path: |
            dist/RunScope.exe
            dist/RunScope-windows-x64.zip
            dist/SHA256SUMS.txt
